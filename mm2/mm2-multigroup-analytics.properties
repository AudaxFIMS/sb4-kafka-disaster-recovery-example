# MirrorMaker 2 for cluster group "analytics" of kafka-dr-example-multi-group.
# One direction only, inside the group: mg-analytics-a:19292 (priority 1) -> mg-analytics-b:19294 (standby).
# Bidirectional replication with IdentityReplicationPolicy causes infinite loops, and
# replicating into another group's clusters would mix two independent Kafkas.

clusters = a, b

a.bootstrap.servers = mg-analytics-a:19292
b.bootstrap.servers = mg-analytics-b:19294

a->b.enabled = true
a->b.topics = .*
b->a.enabled = false

# Same topic names on both clusters, so consumers and seek-by-timestamp need no translation.
# Record timestamps are carried over unchanged, which is what seek-by-timestamp relies on.
replication.policy.class = org.apache.kafka.connect.mirror.IdentityReplicationPolicy

sync.group.offsets.enabled = true
sync.group.offsets.interval.seconds = 10

emit.heartbeats.enabled = true
emit.checkpoints.enabled = true
emit.checkpoints.interval.seconds = 10

refresh.topics.interval.seconds = 10

replication.factor = 1
checkpoints.topic.replication.factor = 1
heartbeats.topic.replication.factor = 1
offset-syncs.topic.replication.factor = 1
offset.storage.replication.factor = 1
status.storage.replication.factor = 1
config.storage.replication.factor = 1

a.consumer.auto.offset.reset = earliest
b.consumer.auto.offset.reset = earliest
